<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--red:#E53935;--teal:#26A69A;--tealS:#E0F2F1;--redS:#FDECEA;--bg:#F8FAFC;--card:#fff;--tx:#1E293B;--tx2:#64748B;--bd:#E2E8F0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F172A;--card:#1B263B;--tx:#F1F5F9;--tx2:#94A3B8;--bd:#2D3B55;--tealS:#12343A;--redS:#3B1C1F}}
:root[data-theme="dark"]{--bg:#0F172A;--card:#1B263B;--tx:#F1F5F9;--tx2:#94A3B8;--bd:#2D3B55;--tealS:#12343A;--redS:#3B1C1F}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;max-width:1100px;margin:auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;margin-inline-end:auto;cursor:pointer}
.logo{width:34px;height:34px;border-radius:50%;border:3px solid var(--teal);display:grid;place-items:center;background:#fff}
.logo i{display:block;width:16px;height:16px;background:linear-gradient(var(--red),var(--red)) center/100% 38% no-repeat,linear-gradient(var(--red),var(--red)) center/38% 100% no-repeat}
.ib{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:6px 12px;font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;max-width:1100px;margin:auto}
nav a{flex:none;padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--tx2);font-size:14px;border:1px solid transparent}
nav a.on{background:var(--tealS);color:var(--teal);border-color:var(--teal);font-weight:700}
main{position:relative;z-index:1;background:var(--bg);min-height:100svh;padding:18px max(14px,calc((100% - 1100px)/2)) 40px;border-radius:0 0 28px 28px}main>*{max-width:1100px;margin-inline:auto}
h1{font-size:26px;margin:0 0 4px}h2{font-size:19px;margin:22px 0 10px}
p.sub{color:var(--tx2);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;backdrop-filter:blur(8px)}
.card h3{margin:0 0 6px;font-size:17px}
.meta{color:var(--tx2);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:12px}
.btn{border:0;border-radius:12px;padding:9px 16px;background:var(--red);color:#fff;font-weight:700}
.btn.t{background:var(--teal)}.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.55;cursor:default}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;background:var(--tealS);color:var(--teal);font-weight:700}
.tag.r{background:var(--redS);color:var(--red)}
.hero{border-radius:20px;padding:26px 20px;background:linear-gradient(135deg,var(--tealS),var(--card));border:1px solid var(--bd);display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.cross{width:88px;height:88px;border-radius:50%;border:6px solid var(--teal);background:#fff;display:grid;place-items:center;flex:none}
.cross i{width:44px;height:44px;display:block;background:linear-gradient(var(--red),var(--red)) center/100% 36% no-repeat,linear-gradient(var(--red),var(--red)) center/36% 100% no-repeat}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.stats div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 16px;min-width:90px}.stats b{display:block;font-size:22px;color:var(--red)}
.login{min-height:70vh;display:grid;place-items:center;text-align:center}
.gbtn{display:inline-flex;gap:10px;align-items:center;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:12px;padding:12px 20px;font-weight:500;margin-top:14px}
.gbtn b{color:#4285F4;font-size:20px}
.room{background:#0B1220;border-radius:18px;padding:12px;color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{aspect-ratio:4/3;border-radius:12px;background:#1B263B;display:grid;place-items:center;position:relative;font-size:26px;font-weight:700}
.tile small{position:absolute;bottom:6px;inset-inline-start:8px;font-size:12px;font-weight:400}
.tile.share{grid-column:1/-1;aspect-ratio:16/7;background:linear-gradient(135deg,#12343A,#1B263B);font-size:16px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.ctrl button{background:#1B263B;color:#fff;border:1px solid #2D3B55;border-radius:12px;padding:8px 12px;font-size:14px}.ctrl button.off{background:var(--red);border-color:var(--red)}
.chat{background:#111A2C;border-radius:12px;padding:10px;height:130px;overflow:auto;font-size:14px}
.row{display:flex;gap:8px;margin-top:8px}.row input{flex:1;border-radius:12px;border:1px solid var(--bd);background:var(--card);padding:9px 12px;min-width:0}
.star{background:none;border:0;font-size:26px;color:#CBD5E1;padding:0 2px}.star.on{color:#F5A623}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;text-align:start;border-bottom:1px solid var(--bd)}
.scroll{overflow-x:auto}
.qr{width:120px;height:120px;background:#fff;padding:6px;border-radius:8px;display:block;margin:8px 0}
.player{background:#000;border-radius:14px;aspect-ratio:16/8;display:grid;place-items:center;color:#fff;margin-bottom:10px}
textarea{width:100%;border-radius:12px;border:1px solid var(--bd);background:var(--card);padding:10px;min-height:70px}
footer{border-top:1px solid var(--bd);padding:18px 14px;text-align:center;color:var(--tx2);font-size:14px}
footer a{color:var(--red);font-weight:700;text-decoration:none}
#toast{position:fixed;inset-inline:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;margin:auto;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes flo{50%{transform:translateY(-6px)}}
@keyframes shine{to{background-position:200% 0}}
main>h1,main>.hero,main>h2{animation:up .45s cubic-bezier(.16,1,.3,1) both}
.grid>.card{animation:up .5s cubic-bezier(.16,1,.3,1) both}
.grid>.card:nth-child(2){animation-delay:.07s}.grid>.card:nth-child(3){animation-delay:.14s}.grid>.card:nth-child(4){animation-delay:.21s}.grid>.card:nth-child(n+5){animation-delay:.28s}
.card{transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(0,0,0,.12);border-color:var(--teal)}
.btn{transition:transform .2s,filter .2s,box-shadow .2s}.btn:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 6px 14px rgba(229,57,53,.25)}.btn:active{transform:scale(.96)}
.ib,nav a,.ctrl button{transition:transform .2s,background .2s,border-color .2s,color .2s}.ib:hover,.ctrl button:hover{transform:translateY(-2px)}nav a:hover{color:var(--teal)}nav a.on{animation:pop .3s both}
.cross{animation:flo 3.5s ease-in-out infinite}
.av{transition:transform .3s}.card:hover .av{transform:scale(1.08) rotate(3deg)}
#adbox img,#adbox video{animation:fade .7s both}
.tile{animation:pop .4s both}.tile:hover{transform:scale(1.03)}
.tag.r{background:linear-gradient(90deg,var(--redS),#fff4,var(--redS));background-size:200% 100%;animation:shine 2.5s linear infinite}
#toast{transform:translateY(12px);transition:opacity .25s,transform .25s}#toast.show{transform:none}
.lgb{animation:pop .6s cubic-bezier(.16,1,.3,1) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

{id:"v3",t:["توعية الإسعافات الأولية للأطفال","Child first-aid awareness"],p:["الزرقاء – مدرسة","Zarqa – School"],d:"2026-12-16",h:4,n:15}];

{id:"c2",t:["مهارات الفحص السريري","Clinical exam skills"],w:["د. أحمد","Dr. Ahmad"],p:["إربد","Irbid"],d:"2026-12-12 14:00",s:20},

var LEC=[{id:"l1",t:["أساسيات علم التشريح","Anatomy basics"],m:["24 دقيقة","24 min"]},{id:"l2",t:["قراءة تخطيط القلب ECG","Reading an ECG"],m:["41 دقيقة","41 min"]},{id:"l3",t:["علم الأدوية المبسّط","Pharmacology made simple"],m:["33 دقيقة","33 min"]}];
var S={user:null,apps:[],seats:[],revs:[],lang:"ar",dark:null,adm:false,mic:1,cam:1,scr:0,hand:0,chat:[]};
try{var x=localStorage.getItem("alnoor");if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
function sv(){try{localStorage.setItem("alnoor",JSON.stringify(S))}catch(e){}}
function t(k){return T[S.lang][k]||k}
function L(a){return a[S.lang=="ar"?0:1]}
function toast(m){var e=document.getElementById("toast");e.textContent=m;e.className="show";clearTimeout(window._t);window._t=setTimeout(function(){e.className=""},2200)}
function tl(){S.lang=S.lang=="ar"?"en":"ar";sv();draw()}

thm();

add:"Add",del:"Delete",free:"Free",ttl:"Title",plc:"Place",dt:"Date",prc:"Price (0 = free)",kv:"Volunteering",kc:"Course",regs:"Registrations",all:"All",dl:"Download Excel/CSV file",

var DBH=null,UR=null,ADMIN=false,ABOUT="",TEAM=[],ITEMS=[],REGS=[],AS=null,DL=null,FILT="";VOL=[];CRS=[];
function L(a){return Array.isArray(a)?a[S.lang=="ar"?0:1]:(a||"")}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pr(p){return p>0?'<span class="price">'+p+(S.lang=="ar"?" د.أ":" JD")+'</span>':'<span class="tag">'+t("free")+'</span>'}

(async function(){try{UR=await claude.use("user");ADMIN=!!(UR&&UR.canEdit());DBH=await claude.use("db");AS=await claude.use("assets");DL=await claude.use("downloads")}catch(e){}

DBH.doc("site/about").onSnapshot(function(s){ABOUT=s.exists?(s.data().text||""):"";rd()},er);

DBH.collection("items").onSnapshot(function(q){ITEMS=docs(q);sync();rd()},er);
if(ADMIN)DBH.collection("regs").onSnapshot(function(q){REGS=[];docs(q).forEach(function(d){Object.keys(d.list||{}).forEach(function(k){var e=d.list[k];REGS.push({item:k,name:d.name,phone:d.phone,email:d.email,title:e.title,kind:e.kind,price:e.price,ts:e.ts})})});REGS.sort(function(a,b){return b.ts-a.ts});rd()},er)})();

function vCrs(){return '<h1>'+t("crs")+'</h1><div class="grid">'+(CRS.map(function(c){var b=S.seats.indexOf(c.id)>-1;return '<div class="card"><h3>'+esc(c.t)+'</h3><div class="meta"><span>📍 '+esc(c.p)+'</span><span>📅 '+esc(c.d)+'</span></div><div style="margin-bottom:10px">'+pr(+c.price)+'</div>'+(b?'<span class="tag">'+t("booked")+'</span>'+qr(c.id+S.user.phone):'<button class="btn" onclick="book(\''+c.id+'\')">'+t("book")+'</button>')+'</div>'}).join("")||empty())+'</div>'}

.atb{position:relative;display:flex;gap:6px;flex-wrap:wrap;padding:5px;background:var(--card);border:2.5px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink)}
.atb i{position:absolute;left:0;top:0;border-radius:11px;background:var(--ink);transition:transform .6s cubic-bezier(.34,1.4,.5,1),width .6s cubic-bezier(.34,1.4,.5,1);pointer-events:none}
.atb button{position:relative;z-index:1;border:0;background:none;padding:8px 16px;border-radius:11px;font-weight:700;font-size:14px;color:var(--tx);transition:color .3s}
.atb button.on{color:var(--sun)}
.atc{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:center;padding:16px 16px 22px;background:var(--card);border:2.5px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;min-height:240px;animation:tabIn .5s cubic-bezier(.16,1,.3,1) both}
@keyframes tabIn{from{opacity:0;transform:scale(.95) translateX(-10px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.atm{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;border:2px solid var(--ink)}.atm img,.atm video{width:100%;height:100%;object-fit:cover;display:block}
.atm2{position:absolute;bottom:8px;inset-inline-end:8px;border:0;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;padding:4px 10px}
.atx h2{margin:0 0 8px;font-size:28px}.atx p{margin:0;color:var(--tx2);white-space:pre-wrap;font-size:16px;line-height:1.7}
.atg{position:absolute;left:0;right:0;bottom:0;height:6px;background:color-mix(in srgb,var(--ink) 12%,transparent)}.atg b{display:block;height:100%;width:0;background:var(--red)}
</style>
<script>
function vAds(){return '<h1>'+A("الإعلانات","Announcements")+'</h1>'+(ADS.length?'<div class="at"><div class="atb"><i id="atp"></i>'+ADS.map(function(a,k){return '<button id="atb'+k+'" onclick="adShow('+k+')">'+esc(a.title||A("إعلان ","Ad ")+(k+1))+'</button>'}).join("")+'</div><div class="atc" id="atc"></div></div>':'<p class="sub">'+t("none")+'</p>')}
function adShow(i){clearTimeout(AT);var c=G("atc");if(!c||!ADS.length)return;AI=((i%ADS.length)+ADS.length)%ADS.length;var a=ADS[AI],nx=function(){adShow(AI+1)},src="/_blob/"+esc(a.src);
ADS.forEach(function(_,k){var e=G("atb"+k);if(e)e.className=k==AI?"on":""});
var b=G("atb"+AI),p=G("atp");p.style.width=b.offsetWidth+"px";p.style.height=b.offsetHeight+"px";p.style.transform="translate("+b.offsetLeft+"px,"+b.offsetTop+"px)";
c.style.animation="none";void c.offsetWidth;c.style.animation="";
c.innerHTML='<div class="atm">'+(a.type=="video"?'<video src="'+src+'" autoplay muted playsinline></video><button class="atm2" onclick="var v=this.parentNode.querySelector(\'video\');v.muted=!v.muted;this.textContent=v.muted?\'🔇\':\'🔊\'">🔇</button>':'<img src="'+src+'" alt="">')+'</div><div class="atx"><h2>'+esc(a.title||A("إعلان ","Ad ")+(AI+1))+'</h2><p>'+esc(a.desc||"")+'</p></div><div class="atg"><b id="atg"></b></div>';
var g=G("atg");
if(a.type=="video"){var v=c.querySelector("video");v.onended=nx;v.onerror=function(){AT=setTimeout(nx,4000)};v.ontimeupdate=function(){g.style.width=(v.currentTime/(v.duration||1)*100)+"%"}}
else{void g.offsetWidth;g.style.transition="width 4s linear";g.style.width="100%";AT=setTimeout(nx,4000)}}
async function addAd(){var f=G("adf").files[0];if(!f)return;if(ADS.length>=4)return toast(A("الحد الأقصى 4 إعلانات","Max 4 ads"));try{var r=await AS.upload(f);await DBH.collection("ads").add({type:f.type.indexOf("video")==0?"video":"img",src:r.id,ts:Date.now(),title:G("adt").value.trim(),desc:G("ads_d").value.trim()});G("adf").value="";G("adt").value="";G("ads_d").value="";toast(t("saved"))}catch(e){toast(t("fail"))}}
var _va2=vAdm;vAdm=function(){return _va2().replace('<input id="adf"','<div class="fld"><input id="adt" placeholder="'+A("عنوان الإعلان","Ad title")+'"><input id="ads_d" placeholder="'+A("شرح الإعلان","Ad description")+'"></div><input id="adf"')};
draw();
</script>
</body>
</html>
